name: Geizhals changed something
description: A filter, id, endpoint or the token stopped working because Geizhals changed upstream
labels: ["upstream-change", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: >
        Use this when the code is fine but Geizhals changed their API: a 401 on
        the token, filter ids or labels that no longer match, missing categories,
        a changed response shape, and so on.
  - type: textarea
    id: symptom
    attributes:
      label: What stopped working?
      placeholder: get_ad_detail returns 401, or search_autos(fuel="Benzin") returns 0 hits, ...
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of change?
      options:
        - Application token rejected (401)
        - Filter id or label changed or missing
        - Category, make or property type changed or missing
        - Response format changed
        - Endpoint moved or removed
        - Other or not sure
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Request/response, ids, or captured values that show the change. Rendered as code.
      render: shell
  - type: checkboxes
    id: recrawl
    attributes:
      label: Data
      options:
        - label: This probably needs the bundled data (data/) to be re-crawled
