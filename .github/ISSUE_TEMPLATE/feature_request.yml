name: Feature request
description: Suggest a new tool, filter, vertical or improvement
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: request
    attributes:
      label: What would you like?
      description: The feature and the use case it enables.
      placeholder: A radius filter (listings within X km of a postcode), ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Search
        - Product / prices
        - Ratings
        - Categories
        - Auth / token
        - Tooling / data
        - Other
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
