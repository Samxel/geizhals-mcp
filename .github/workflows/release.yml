name: release
# Push a tag such as v1.1 or v1.1.2 (matching the version in pyproject.toml and
# manifest.json; a .0 patch may be left off the tag) to build the Python package
# and the Claude Desktop bundle and attach both to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          manifest=$(python -c "import json; print(json.load(open('manifest.json'))['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if { [ "$tag" != "$version" ] && [ "$tag" != "${version%.0}" ]; } || [ "$manifest" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME, pyproject.toml $version, manifest.json $manifest -- bump both first"
            exit 1
          fi

      - name: Run the offline suite
        run: |
          pip install -r requirements.txt pytest
          pytest -q

      - name: Build the wheel and sdist
        run: |
          pip install build
          python -m build

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pack the Claude Desktop bundle
        run: |
          npx -y @anthropic-ai/mcpb@2 validate manifest.json
          npx -y @anthropic-ai/mcpb@2 pack . "dist/${{ github.event.repository.name }}.mcpb"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
