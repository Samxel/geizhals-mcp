[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geizhals-mcp"
version = "1.0.0"
description = "MCP server for Geizhals price comparison: products, best prices, price history, deals and price alarms"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Samxel" }]
keywords = ["mcp", "geizhals", "price-comparison", "claude"]
dependencies = ["mcp>=2.3.0,<3", "httpx[http2]>=0.28.1"]

[project.scripts]
geizhals-mcp = "geizhals.server:main"

[project.urls]
Repository = "https://github.com/Samxel/geizhals-mcp"
Issues = "https://github.com/Samxel/geizhals-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["geizhals"]

[tool.hatch.build.targets.sdist]
exclude = [".github", "tests", "scripts", "manifest.json", ".mcpbignore"]
